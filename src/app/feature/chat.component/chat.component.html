<section class="wrap">
  <header class="head">
    <div>💬 <strong>Chatter</strong> — public room</div>
    <div class="nick">Nick: <b>{{ nick() }}</b> <span class="dot" [class.on]="connected()"></span></div>
  </header>

  <div class="box">
    <div *ngFor="let message of messages" class="line" [class.sys]="message.messageType!=='CHAT'">
      <ng-container [ngSwitch]="message.messageType">
        <span *ngSwitchCase="'CHAT'"><b>{{ message.sender }}:</b> {{ message.content }}</span>
        <span *ngSwitchCase="'JOIN'">➡️ {{ message.sender }} joined</span>
        <span *ngSwitchCase="'LEAVE'">👋 {{ message.sender }} left</span>
        <span *ngSwitchDefault>[SYSTEM] {{ message.content }}</span>
      </ng-container>
      <time>{{ message.sentAt ? (message.sentAt | date:'HH:mm') : '' }}</time>
    </div>
  </div>

  <footer class="row">
    <input [(ngModel)]="text" (keydown.enter)="send()" placeholder="Napisz wiadomość…"/>
    <button type="button"
            (click)="send()"
            [disabled]="!connected() || !text?.trim()"
            aria-label="Send" title="Send">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"></path>
      </svg>
    </button>
  </footer>
</section>
