<section class="page">

  <header class="top-bar">
    <h1>💬 Chatter</h1>

    <div class="top-actions">
      <button class="secondary" (click)="openCreateRoom()">+ Create room</button>
    </div>
  </header>

  <main class="content">

    <app-chat class="chat-card"></app-chat>

    <section class="rooms-card">
      <h2>Available rooms</h2>

      <ul *ngIf="rooms.length; else empty">
        <li *ngFor="let room of rooms">
    <span class="room-name">
      {{ room.name }}
      <span *ngIf="room.isPrivate" class="lock" title="Private room">🔒</span>
    </span>
          <button (click)="joinRoom(room)">Join</button>
        </li>
      </ul>

      <ng-template #empty>
        <p class="empty">No rooms available</p>
      </ng-template>
    </section>

  </main>
</section>

<div class="modal-backdrop" *ngIf="showCreateModal" (click)="closeCreateRoom()"></div>

<section class="modal" *ngIf="showCreateModal">
  <app-room-create
    (created)="onRoomCreated()"
    (cancel)="closeCreateRoom()">
  </app-room-create>
</section>
