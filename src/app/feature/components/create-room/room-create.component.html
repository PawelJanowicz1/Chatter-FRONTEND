<section class="create-card" (click)="$event.stopPropagation()">

  <h2>Create new room</h2>

  <div class="form">

    <div class="field">
      <label>Room name</label>
      <input
        type="text"
        [(ngModel)]="name"
        autofocus
      />
    </div>

    <div class="field">
      <label>Room capacity</label>
      <div class="capacity-row">
        <input
          type="range"
          min="2"
          max="50"
          step="1"
          [(ngModel)]="maxCapacity"
        />
        <span class="capacity-value">{{ maxCapacity }}</span>
      </div>
    </div>

    <label class="checkbox">
      <input type="checkbox" [(ngModel)]="isPrivate" />
      <span class="checkmark"></span>
      Private room
    </label>

    <div class="field" *ngIf="isPrivate">
      <label>Room password</label>
      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Min. 3 characters"
        autocomplete="new-password"
      />
    </div>

  </div>

  <div class="actions">
    <button class="ghost" (click)="cancel.emit()">Cancel</button>
    <button
      class="create-btn"
      [class.ready]="isFormValid"
      (click)="create()"
      [disabled]="loading || !isFormValid"
    >
      {{ loading ? 'Creating…' : 'Create' }}
    </button>
  </div>

</section>
